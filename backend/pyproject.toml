[project]
name = "black-box"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yussef96795", email = "216763984+yussef96795@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "docling[charts,pdf]>=2.129.0",
    "fastapi>=0.141.1",
    "langchain-core",
    "langgraph",
    "psycopg2-binary",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[project.scripts]
black-box = "black_box:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
